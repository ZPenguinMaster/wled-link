; Self-test for the ESP-NOW link protocol (wled/usermod/link_proto.h). Flash to any ESP32, then read the
; serial port at 921600 baud:  pio run -t upload --upload-port COMx  &&  pio device monitor
[env:linktest]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=0
