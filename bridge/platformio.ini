; WLED Link bridge firmware (runs on the spare ESP32 that stays plugged into the PC).
; Build + flash:  pio run -t upload --upload-port COMx
; Or flash the prebuilt image with:  python pc\wledlink.py flash-bridge --port COMx

[env:bridge]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = default.csv
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; the bridge is only ever a Bluetooth peripheral: leaving the other roles out saves RAM and flash
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Bluetooth buffers for the phone's copy of WLED's web page (12 by default)
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
extra_scripts = post:merge_image.py
